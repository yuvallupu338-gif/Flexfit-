    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) { return initialValue; }
      });
      const setValue = useCallback(value => {
        try {
          setStoredValue(prev => {
            const valueToStore = value instanceof Function ? value(prev) : value;
            window.localStorage.setItem(key, JSON.stringify(valueToStore));
            return valueToStore;
          });
        } catch (error) { console.error("Storage Error:", error); }
      }, [key]);
      return [storedValue, setValue];
    }

    // ─────────────────────────────────────────
    // AI COACH GEOMETRY ENGINE (VISION)
    // ─────────────────────────────────────────
    const calculateAngle = (a, b, c) => {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    };

    function AiCoach({ currentExerciseName, th }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const lastSpokenTime = useRef(0);
      const lowestAngle = useRef(180);

      const speakFeedback = (text) => {
        const now = new Date().getTime();
        if (now - lastSpokenTime.current > 3000) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'he-IL';
          window.speechSynthesis.speak(utterance);
          lastSpokenTime.current = now;
        }
      };

      useEffect(() => {
        if (!videoRef.current || !canvasRef.current) return;
        
        const videoElement = videoRef.current;
        const canvasElement = canvasRef.current;
        const canvasCtx = canvasElement.getContext('2d');

        const pose = new window.Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
        });

        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });

        pose.onResults((results) => {
          if (!canvasElement) return;
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
          
          if (results.poseLandmarks) {
            window.drawConnectors(canvasCtx, results.poseLandmarks, window.POSE_CONNECTIONS, { color: th.hex, lineWidth: 3 });
            window.drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#ffffff', lineWidth: 1, radius: 2 });

            const marks = results.poseLandmarks;
            const exName = currentExerciseName || '';

            if (exName.includes('סקוואט')) {
               const hip = marks[23] || marks[24];
               const knee = marks[25] || marks[26];
               const ankle = marks[27] || marks[28];
               
               if (hip && knee && ankle) {
                 const angle = calculateAngle(hip, knee, ankle);
                 if (angle < lowestAngle.current) lowestAngle.current = angle;
                 if (angle > lowestAngle.current + 15) {
                    if (lowestAngle.current > 100) {
                        speakFeedback("לא ירדת מספיק! תשבור מקביל!");
                    }
                    lowestAngle.current = 180;
                 }
               }
            }
            else if (exName.includes('שכיבות סמיכה')) {
               const shoulder = marks[11] || marks[12];
               const elbow = marks[13] || marks[14];
               const wrist = marks[15] || marks[16];
               
               if (shoulder && elbow && wrist) {
                 const angle = calculateAngle(shoulder, elbow, wrist);
                 if (angle < lowestAngle.current) lowestAngle.current = angle;
                 if (angle > lowestAngle.current + 15) {
                    if (lowestAngle.current > 110) {
                        speakFeedback("תרד עד שהחזה נוגע ברצפה!");
                    }
                    lowestAngle.current = 180;
                 }
               }
            }
          }
          canvasCtx.restore();
        });

        const camera = new window.Camera(videoElement, {
          onFrame: async () => { await pose.send({ image: videoElement }); },
          width: 640, height: 480,
        });
        camera.start();

        return () => {
          camera.stop();
          pose.close();
        };
      }, [currentExerciseName, th]);

      return (
        <div className={`relative w-full aspect-[4/3] bg-zinc-950 rounded-2xl overflow-hidden border-2 mt-4 shadow-lg`} style={{borderColor: th.hex}}>

             <span className="w-2 h-2 rounded-full bg-current"></span> עין ה-AI פעילה
           </div>
        </div>
      );
    }

    const TARGETS = ['push','core','legs','pull','push','core','legs','pull','core'];

    const getDetailedDesc = (name) => {
       if (name.includes('שכיבות סמיכה')) return "1. מקם ידיים ברוחב כתפיים.\n2. שמור על גוף ישר כמו קרש, כווץ ישבן ובטן.\n3. רד עד שהחזה כמעט נוגע ברצפה.\n4. דחוף בעוצמה למעלה עד נעילת מרפקים.";
       if (name.includes('מתח')) return "1. תלה מהמוט במצב 'דד האנג' (Dead Hang).\n2. משוך את השכמות למטה ואחורה.\n3. משוך עד שהסנטר עוקף את המוט.\n4. רד בשליטה מלאה חזרה למטה.";
       if (name.includes('סקוואט')) return "1. עמוד ברוחב כתפיים, כפות רגליים החוצה.\n2. דחוף אגן לאחור (כמו ישיבה על כיסא).\n3. רד לפחות עד שבירת מקביל.\n4. דחוף דרך העקבים חזרה לעמידה.";
       if (name.includes('מקבילים') || name.includes('Dips')) return "1. אחוז במקבילים ודחוף כתפיים מהאוזניים.\n2. רד בשליטה עד שהכתף מתחת למרפק.\n3. דחוף חזרה למעלה באגרסיביות.";
       if (name.includes('פלאנק')) return "1. הישען על האמות מתחת לכתפיים.\n2. כווץ בטן חזק ואל תיתן לגב לצנוח.\n3. נשום רגיל תוך כדי כיווץ רציף.";
       if (name.includes('דדליפט')) return "1. מוט חוצה את מרכז כף הרגל.\n2. אגן אחורה, גב ישר לגמרי.\n3. דחוף את הרצפה עם הרגליים והזדקף.";

    // ─────────────────────────────────────────
    // SHIFTING MATRIX ALGORITHM
    // ─────────────────────────────────────────
    const generatePersonalizedTiers = (baseMatrix, typeName, answers) => {
      let pushO=0, pullO=0, coreO=0, legsO=0;
      if(answers.pushups === '30+') pushO=6; else if(answers.pushups === '16-30') pushO=4; else if(answers.pushups === '6-15') pushO=2;
      if(answers.pullups === '10+') pullO=7; else if(answers.pullups === '5-10') pullO=4; else if(answers.pullups === '1-4') pullO=2;
      let sO=0; if(answers.situps==='50+') sO=6; else if(answers.situps==='31-50') sO=4; else if(answers.situps==='16-30') sO=2;
      let pO=0; if(answers.plank==='3 דקות ומעלה') pO=6; else if(answers.plank==='2-3 דקות') pO=4; else if(answers.plank==='1-2 דקות') pO=2;
      coreO = Math.max(sO, pO);
      if(answers.squats==='מצליח פיסטול (רגל אחת)') legsO=8; else if(answers.squats==='51-100') legsO=6; else if(answers.squats==='21-50') legsO=4;

      const offsets = { push: pushO, pull: pullO, core: coreO, legs: legsO };
      const age = parseInt(answers.age) || 25;
      const weight = parseInt(answers.weight) || 70;
      const height = parseInt(answers.height) || 170;
      const bmi = weight / Math.pow(height/100, 2);

      const tiers = [];
      const TIER_COUNT = 6; 
      for (let i = 0; i < TIER_COUNT; i++) {
        const skills = [];
        for (let j = 0; j < 9; j++) {
          const target = TARGETS[j];
          let row = i + offsets[target];
          if (row >= baseMatrix.length) row = baseMatrix.length - 1;

          let exName = baseMatrix[row][j];
          if (parseFloat(bmi) > 26 || age > 45) {
             exName = exName.replace('קפיצה', 'מבוקרת').replace('מתפרץ', 'איטי').replace("פלאנץ'", "סטטי");
          }

          let wFactor = 0;
          if (typeName === 'gym') {
             wFactor = 0.2 + (row * 0.15);
             if (target === 'legs' || exName.includes('דדליפט')) wFactor += 0.3;
          }
          skills.push({ id: `${typeName}_${i}_${j}`, name: exName, desc: getDetailedDesc(exName), target: target, wFactor: wFactor, level: i+1 });
        }

        const pushSk = skills.find(s=>s.target==='push') || skills[0];
        const pullSk = skills.find(s=>s.target==='pull') || skills[0];
        const coreSk = skills.find(s=>s.target==='core') || skills[0];

        let repsPush = Math.max(4, 15 - (i + offsets.push) * 2);
        let repsPull = Math.max(2, 10 - (i + offsets.pull));

        let testDesc = "";
        if (i === TIER_COUNT - 1) {
            testDesc = `🏆 מבחן מאסטר סופי! הוכח שאתה אגדה ב-${pushSk.name} וב-${pullSk.name}!`;
        } else if (typeName === 'gym') {
            testDesc = `⚡ מבחן מעבר (לרמה ${i+2}): בצע 3 סטים של ${repsPush} חזרות ב-${pushSk.name}, ואז ${repsPull} חזרות ב-${pullSk.name}.`;
        } else {
            testDesc = `🔥 מבחן סיבולת (לרמה ${i+2}): בצע ${repsPush} חזרות של ${pushSk.name}, ואז ${repsPull} חזרות ב-${pullSk.name}, וסיים במקסימום ${coreSk.name}.`;
        }

        tiers.push({ level: i + 1, name: `רמה ${i + 1}`, testDesc, skills });
      }
      return tiers;
    };

    const calcTDEE = (w, h, a, gender, goal) => {
      let W = parseFloat(w) || 70; let H = parseFloat(h) || 175; let A = parseFloat(a) || 25;
      if(H < 3) H = H * 100; if(W > 250) W = 70; 
      const bmr = gender === 'נקבה' ? (10 * W) + (6.25 * H) - (5 * A) - 161 : (10 * W) + (6.25 * H) - (5 * A) + 5;
      const baseTdee = Math.round(bmr * 1.375);
      if (A < 16) return Math.min(2400, Math.max(1500, baseTdee));
      let target = goal?.indexOf('ירידה') >= 0 ? baseTdee - 300 : baseTdee + 300;
      return Math.min(3500, Math.max(1200, target));
    };

         }
       };
       return p[mood] || p.training; 
    }

    const ALLERGY_MAP = {'בוטנים':'peanut','אגוזים':'nuts','גלוטן':'gluten','לקטוז':'lactose','ביצים':'egg','דגים':'fish','סויה':'soy'};

    const NOTIF_SLOTS = [

    // ─────────────────────────────────────────
    // GENERATING SCREEN
    // ─────────────────────────────────────────
    function GeneratingScreen({ onFinish, th }) {
      const [progress, setProgress] = useState(0);
      const [text, setText] = useState("מנתח נתונים אישיים...");

      useEffect(() => {
        let currentProgress = 0;
        const interval = setInterval(() => {
          currentProgress += 1; setProgress(currentProgress);
          if (currentProgress === 15) setText("מחשב נתוני TDEE ומגן מפרקים...");
          if (currentProgress === 35) setText("מפעיל את מנוע ה-Shifting Matrix...");
          if (currentProgress === 55) setText("מסנכרן אימונים סביב התרגילים הקשים שלך...");
          if (currentProgress === 75) setText("מרכיב הנחיות טכניות וביומכניקה...");
          if (currentProgress === 90) setText("שומר נתונים, מתחילים...");
          if (currentProgress >= 100) { 
             clearInterval(interval); 
             onFinish(); 
          }
        }, 30); 
        return () => clearInterval(interval);
      }, [onFinish]); 

      return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col items-center justify-center p-8 text-center">
          <div className={`w-32 h-32 mb-8 rounded-full border-4 ${th.borderPrimary} border-t-transparent animate-spin flex items-center justify-center`}><div className="text-4xl animate-none">{th.emoji}</div></div>
          <h2 className="text-3xl font-black text-white mb-2">מייצר את הטירוף...</h2>
          <p className={`text-sm ${th.textPrimaryLight} font-bold mb-12 h-6 transition-all`}>{text}</p>
          <div className="w-full bg-zinc-900 p-1 rounded-full border border-zinc-800 shadow-inner mb-4">
             <div className={`h-3 rounded-full ${th.gradientBg} transition-all duration-100 ease-linear shadow-lg ${th.shadowPrimary}`} style={{width: `${progress}%`}}></div>
          </div>
          <div className="text-zinc-500 font-bold tabular-nums text-xl">{progress}%</div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useLocalStorage('fitai_screen', 'splash');
      const [answers, setAnswers] = useLocalStorage('fitai_answers', {});
      const [qIdx, setQIdx] = useLocalStorage('fitai_qIdx', 0);
      const [xp, setXp] = useLocalStorage('fitai_xp', 0);
      const [workouts, setWorkouts] = useLocalStorage('fitai_workouts', 0);
      const [mastered, setMastered] = useLocalStorage('fitai_mastered', []);
      const [unlockedTier, setUnlockedTier] = useLocalStorage('fitai_tier', 1);
      const [notifEnabled, setNotifEnabled] = useLocalStorage('fitai_notifs', {});
      
      const [thisWeekWorkouts, setThisWeekWorkouts] = useLocalStorage('fitai_thisWeekWorkouts', 0);
      const [thisWeekMeals, setThisWeekMeals] = useLocalStorage('fitai_thisWeekMeals', 0);
      const [lastReportReset, setLastReportReset] = useLocalStorage('fitai_lastReportReset', null);
      const [lastMealTrack, setLastMealTrack] = useLocalStorage('fitai_lastMealTrack', null);

      const [localVal,setLocalVal] = useState('');
      const [toast,setToast] = useState(null);
      const [agreed,setAgreed] = useState(false);
      const [toastQueue,setToastQueue] = useState([]);
    
      const isHybrid = answers.style === 'שילוב (גם וגם)';
      const th = getTheme(answers.style);
      
      const caliTiersBase = useMemo(() => generatePersonalizedTiers(CALI_MATRIX, 'cali', answers), [answers]);
      const gymTiersBase = useMemo(() => generatePersonalizedTiers(GYM_MATRIX, 'gym', answers), [answers]);

      const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),2500); };
      const addXP = (n) => { setXp(p=>(parseInt(p)||0)+n); showToast(`+${n} XP ${th.emoji}`); };
    
      useEffect(() => {
        if (screen !== 'app') return;
        const tick = () => {
          const now = new Date();
          const isW  = answers.days && answers.days.indexOf(DAYS_HE[now.getDay()])>=0;
          const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
          const name = answers.name||'Lupu';
          
          NOTIF_SLOTS.forEach(slot => {
            if (notifEnabled[slot.id] === false) return;
            if (now.getHours()===slot.hour && now.getMinutes()===slot.min && now.getSeconds()<35) {
              const body = slot.bodyFn(isW,goal,name);
              if ('Notification' in window && Notification.permission === 'granted') { new Notification(slot.title, { body, icon: th.emoji }); }
              setToastQueue(q => { if (q.find(x => x.id === slot.id)) return q; return [...q,{id: slot.id, icon:slot.icon, title:slot.title, body, key:Date.now()+slot.id}]; });
            }
          });
        };
        const id = setInterval(tick, 30000);
        return () => clearInterval(id);
      }, [screen, notifEnabled, answers, th.emoji]);

      useEffect(() => {
        if (!toastQueue.length) return;
        const t = setTimeout(() => setToastQueue(q => q.slice(1)), 5000);
        return () => clearTimeout(t);
      }, [toastQueue]);

      const filteredQ = useMemo(() => {
         return QUESTIONS.filter(q => {
            const isGymOrHybrid = answers.style && (answers.style.includes('חדר כושר') || answers.style.includes('שילוב'));
            if (q.id === 'location' && isGymOrHybrid) return false; 
            if (q.id === 'equip' && isGymOrHybrid) return false; 
            if (q.id === 'equip' && answers.location && answers.location.includes('חדר כושר')) return false;
            return true;
         });
      }, [answers.location, answers.style]);

      useEffect(() => {
         if (qIdx >= filteredQ.length && filteredQ.length > 0) {
             setQIdx(Math.max(0, filteredQ.length - 1));
         }
      }, [filteredQ.length, qIdx, setQIdx]);

      const activeQ = filteredQ[Math.min(qIdx, Math.max(0, filteredQ.length - 1))] || {};
    
      useEffect(() => { 
        if (!activeQ?.id) return;
        let initial = answers[activeQ.id];
        if (initial === undefined) {
           if (activeQ.type === 'slider') initial = activeQ.default;
           else if (activeQ.type === 'multi' || activeQ.type === 'days') initial = [];
           else initial = '';
        }
        setLocalVal(initial); 
      }, [qIdx, activeQ, answers]); 
    
      const canProceed = () => {
        if (!activeQ || !activeQ.id) return false;
        if (activeQ.id === 'dislikes') return true; 
        const val = localVal;
        if (val === undefined || val === null || val === '') return false;
        if (activeQ.type === 'slider' || activeQ.type === 'number' || activeQ.type === 'text') return String(val).trim() !== '';
        if (activeQ.type === 'multi' || activeQ.type === 'days') return Array.isArray(val) && val.length > 0;
        if (activeQ.type === 'choice') return String(val).trim() !== '';
        return false;
      };
      
      const goNext = () => {
        if(!canProceed()) return; 
        let na = {...answers};
        if (['text','number','slider','multi','days','choice'].includes(activeQ.type)) na[activeQ.id] = localVal;
        setAnswers(na);
        if (qIdx < filteredQ.length - 1) setQIdx(qIdx + 1); else setScreen('generating');
      };
      
      const setChoice = (opt) => {
        let na = {...answers, [activeQ.id]:opt};
        const isGymOrHybrid = (activeQ.id === 'style' && (opt.includes('חדר כושר') || opt.includes('שילוב')));
        if (isGymOrHybrid) {
          na.location = 'חדר כושר';
          na.equip = ['מוט מתח','מקבילים','טבעות','משקולות','גומיות','מכשירים'];
        }
        if (activeQ.id==='location' && opt.includes('חדר כושר')) {
          na.equip = ['מוט מתח','מקבילים','טבעות','משקולות','גומיות','מכשירים'];
        }
        setAnswers(na);
        setLocalVal(opt);
        
        if (qIdx < filteredQ.length - 1) setQIdx(qIdx + 1);
        else setScreen('generating');
      };
      
      const toggleMulti = (opt) => {
        const cur = Array.isArray(localVal) ? localVal : []; 
        const excl = ['ללא','ללא פציעות','ללא ציוד'];
        if (excl.includes(opt)) {
            setLocalVal([opt]);
            return;
        }
        const filtered = cur.filter(x => !excl.includes(x));
        const next = filtered.includes(opt) ? filtered.filter(x => x !== opt) : [...filtered, opt];
        setLocalVal(next);
      };
    
      const resetApp = () => {
        if(window.confirm("האם אתה בטוח שברצונך למחוק את כל הנתונים ולהתחיל מחדש? פעולה זו תאפס הכל.")){
          localStorage.clear(); window.location.reload(); 
        }
      };

      const toggleNotif = async (id, val) => {
        if (val && 'Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') { await Notification.requestPermission(); }
        setNotifEnabled(prev => ({...prev, [id]:val}));
      };

      const toggleAllNotifs = async () => {
        const allOn = NOTIF_SLOTS.every(s => notifEnabled[s.id] !== false);
        if (!allOn && 'Notification' in window && Notification.permission !== 'granted') { await Notification.requestPermission(); }
        const next = {}; NOTIF_SLOTS.forEach(s => { next[s.id] = !allOn; }); setNotifEnabled(next);
      };

      const sendTestNotif = (slot) => {
        const isW  = answers.days && answers.days.indexOf(DAYS_HE[new Date().getDay()])>=0;
        const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
        const body = slot.bodyFn(isW, goal, answers.name||'Lupu');
        if ('Notification' in window && Notification.permission === 'granted') { new Notification(slot.title, { body, icon: th.emoji }); }
        setToastQueue(q => [...q, {icon:slot.icon, title:slot.title, body, key:Date.now()}]);
      };

      const handleMealTrack = () => {
        const todayStr = new Date().toDateString();
        if (lastMealTrack !== todayStr) {
          setThisWeekMeals(m => m + 1); setLastMealTrack(todayStr); addXP(20);
        } else showToast('כבר סימנת תזונה להיום 🏆');
      };
      
      const finishGenerating = useCallback(() => {
          setUnlockedTier(1); 
          setScreen('app');
      }, [setScreen, setUnlockedTier]);
    
      if (screen==='splash') return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col items-center justify-center p-6 relative overflow-hidden" style={{fontFamily:'system-ui,sans-serif'}}>
          <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-600 rounded-full opacity-10 blur-[100px]`}/>
          <div className="relative z-10 text-center w-full max-w-sm">
            <img src="https://i.ibb.co/fzRrLJc0/logo.png" alt="Fitai Logo" className="w-32 h-32 mx-auto mb-6 rounded-3xl shadow-2xl shadow-orange-500/30 object-cover border border-zinc-800" />
            <h1 className={`text-6xl font-black text-white mb-3 tracking-tight`}>Fitai</h1>
            <p className="text-zinc-400 text-lg mb-12">המערכת החכמה שמותאמת במאה אחוז אליך.</p>
            <button onClick={()=>setScreen('health')} className={`w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-black py-5 rounded-2xl text-xl hover:scale-105 active:scale-95 transition-all shadow-lg shadow-orange-500/30 flex items-center justify-center gap-3`}>
              <span>התחל / המשך</span>
            </button>
          </div>
        </div>
      );
    
      if (screen==='health') return (
        <div dir="rtl" className="min-h-screen bg-black flex flex-col p-6" style={{fontFamily:'system-ui,sans-serif'}}>
          <div className="max-w-md mx-auto w-full flex-1 flex flex-col pt-4">
            <div className={`text-orange-500 font-bold uppercase tracking-widest text-xs mb-2`}>מסמך משפטי מחייב</div>
            <h2 className="text-3xl font-black text-white mb-5">בטיחות לפני הכל.</h2>
            <div className="flex-1 bg-zinc-900 rounded-3xl p-6 border border-zinc-800 mb-5 overflow-y-auto max-h-96 space-y-4 text-zinc-300 text-sm leading-relaxed">
              <p><b className="text-white block mb-1">1. פטור נזיקין:</b>האימונים באחריותך הבלעדית.</p>
              <p><b className="text-white block mb-1">2. אישור רפואי:</b>חובה להתייעץ עם רופא לפני תחילת תוכנית אימונים.</p>
              <p><b className="text-white block mb-1">3. כאב = עצור:</b>כאב חד, סחרחורת, בחילה? עצור מיידית.</p>
              <p><b className="text-white block mb-1">4. תזונה:</b>התפריטים הם המלצה כללית בלבד.</p>
            </div>
            <button type="button" onClick={()=>setAgreed(!agreed)} className={`flex justify-between items-center p-5 rounded-2xl border-2 mb-4 transition-all w-full text-right ${agreed?`border-orange-500 bg-orange-500/10`:'border-zinc-700 hover:border-zinc-600 cursor-pointer'}`}>
              <div className={`w-6 h-6 rounded flex items-center justify-center border-2 flex-shrink-0 transition-all ${agreed?`bg-orange-500 border-orange-500`:'border-zinc-500'}`}>{agreed && <Check className="w-4 h-4 text-white" strokeWidth={3}/>}</div>
              <span className="font-bold text-sm text-white">קראתי ואני מאשר/ת הכל</span>
            </button>
            <button disabled={!agreed} onClick={()=>setScreen('q')} className={`w-full py-4 rounded-2xl font-black text-xl transition-all ${agreed?'bg-white text-black active:scale-95 shadow-xl':'bg-zinc-900 text-zinc-600 border border-zinc-800 cursor-not-allowed'}`}>המשך לשאלון</button>
          </div>
        </div>
      );
    
      if (screen==='q') {
        const qTheme = answers.style ? getTheme(answers.style) : { textPrimary: 'text-orange-500', borderPrimary: 'border-orange-500', bgPrimary10: 'bg-orange-500/10', gradientBg: 'bg-gradient-to-r from-orange-500 to-red-600', hex: '#f97316' };
        if (!activeQ?.id) return null; 

        return (
          <div dir="rtl" className={`min-h-screen bg-black flex flex-col p-6 text-white`} style={{fontFamily:'system-ui,sans-serif'}}>
            <div className="max-w-md mx-auto w-full flex-1 flex flex-col">
              <div className="flex justify-between items-center mb-4 pt-4">
                <button onClick={()=>qIdx===0?setScreen('health'):setQIdx(qIdx-1)} className="text-zinc-500 text-2xl p-2 hover:text-white">›</button>
                <span className="text-xs text-zinc-500 font-bold uppercase">{qIdx+1} / {filteredQ.length}</span>
              </div>
              <div className="w-full h-1.5 bg-zinc-900 rounded-full mb-8 overflow-hidden border border-zinc-800">
                <div className={`h-full ${qTheme.gradientBg} transition-all duration-300`} style={{width:`${((qIdx+1)/filteredQ.length)*100}%`}}/>
              </div>
              <h2 className="text-3xl font-black text-white mb-8 leading-tight">{activeQ.q}</h2>
              <div className="flex-1 overflow-y-auto pb-4 space-y-3">
                {activeQ.type==='choice' && activeQ.options?.map(opt=>(
                  <button key={opt} onClick={()=>setChoice(opt)} className={`w-full p-5 rounded-2xl border-2 text-right font-bold text-lg transition-all ${localVal===opt?`${qTheme.borderPrimary} ${qTheme.bgPrimary10} text-white`:'bg-zinc-900 border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}>{opt}</button>
                ))}
                {(activeQ.type==='multi'||activeQ.type==='days') && activeQ.options?.map(opt=>{
                  const sel=(localVal||[]).indexOf(opt)>=0;
                  return(
                    <button key={opt} onClick={()=>toggleMulti(opt)} className={`w-full flex justify-between items-center p-5 rounded-2xl border-2 font-bold text-lg transition-all ${sel?`${qTheme.bgPrimary10} ${qTheme.borderPrimary} text-white`:'bg-zinc-900 border-zinc-800 text-zinc-400 hover:border-zinc-700'}`}>
                      {sel ? <Check className={`w-5 h-5 ${qTheme.textPrimary}`}/> : <span/>}<span>{opt}</span>
                    </button>
                  );
                })}
                {(activeQ.type==='text') && <input type="text" placeholder={activeQ.placeholder} value={localVal} onChange={e=>setLocalVal(e.target.value)} className={`w-full bg-zinc-900 p-5 rounded-2xl border border-zinc-800 text-xl text-white font-bold text-right outline-none focus:ring-2 transition-colors`} style={{'--tw-ring-color': qTheme.hex}} autoFocus/>}
                {(activeQ.type==='number') && <input type="number" placeholder={activeQ.placeholder} min={activeQ.min} max={activeQ.max} value={localVal} onChange={e=>setLocalVal(e.target.value)} className={`w-full bg-zinc-900 p-5 rounded-2xl border border-zinc-800 text-xl text-white font-bold text-right outline-none focus:ring-2 transition-colors`} style={{'--tw-ring-color': qTheme.hex}} autoFocus/>}
                {(activeQ.type==='slider') && (
                  <div className="bg-zinc-900 p-8 rounded-3xl border border-zinc-800 text-center mt-4 shadow-lg">
                    <div className="text-6xl font-black text-white mb-8 tabular-nums">{localVal || activeQ.default}</div>
                    <input type="range" min={activeQ.min} max={activeQ.max} step={activeQ.step||1} value={localVal || activeQ.default} onChange={e=>setLocalVal(e.target.value)} className="w-full" style={{ color: qTheme.hex }} />
                    <div className="flex justify-between text-zinc-500 text-sm mt-4 font-bold"><span>{activeQ.min}</span><span>{activeQ.max}</span></div>
                  </div>
                )}
              </div>
              <button disabled={!canProceed()} onClick={goNext} className={`w-full py-4 rounded-2xl font-black mt-4 text-xl transition-all ${canProceed()?'bg-white text-black active:scale-95 shadow-lg':'bg-zinc-900 text-zinc-600 border border-zinc-800 cursor-not-allowed'}`}>
                {activeQ.id === 'dislikes' && (!localVal || String(localVal).trim() === '') ? 'דלג' : 'המשך'}
              </button>
            </div>
          </div>
        );
      }

      if (screen==='generating') return <GeneratingScreen onFinish={finishGenerating} th={th} />;
    
      return (
        <div dir="rtl" className="min-h-screen bg-black text-white" style={{fontFamily:'system-ui,sans-serif'}}>
          {toast && (<div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-white text-black px-6 py-3 rounded-full shadow-2xl font-black text-sm transition-all">{toast}</div>)}
          {toastQueue.slice(0,1).map(n => (
            <div key={n.key} className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-zinc-900 border ${th.borderPrimary40} rounded-2xl px-4 py-3 shadow-2xl max-w-xs w-full text-right`}>
              <div className="flex items-start gap-3"><button onClick={()=>setToastQueue(q=>q.slice(1))} className="text-zinc-500 text-xs mt-0.5 hover:text-white">✕</button><div className="flex-1"><div className="font-black text-white text-sm">{n.icon} {n.title}</div><div className="text-xs text-zinc-400 mt-0.5">{n.body}</div></div></div>
            </div>
          ))}
          <MainAppTabs
            answers={answers} xp={parseInt(xp) || 0} mastered={mastered} workouts={workouts} unlockedTier={unlockedTier}
            notifEnabled={notifEnabled} onToggleNotif={toggleNotif} onToggleAllNotifs={toggleAllNotifs} onTestNotif={sendTestNotif}
            thisWeekWorkouts={thisWeekWorkouts} thisWeekMeals={thisWeekMeals} 
            lastReportReset={lastReportReset} setLastReportReset={setLastReportReset}
            setThisWeekWorkouts={setThisWeekWorkouts} setThisWeekMeals={setThisWeekMeals}
            onMealTrack={handleMealTrack} lastMealTrack={lastMealTrack}
            th={th} isHybrid={isHybrid} caliTiersBase={caliTiersBase} gymTiersBase={gymTiersBase}
            onWorkoutDone={()=>{ setWorkouts(w=>w+1); setThisWeekWorkouts(w=>w+1); addXP(100); }}
            onToggleSkill={(id)=>{
              const m = mastered || [];
              const has = m.includes(id); 
              setMastered(has ? m.filter(x=>x!==id) : [...m,id]);
              showToast(has ? `הוסר מהאימונים` : `${th.emoji} יוזרק לאימון הבא!`); 
            }}
            onPassTest={(tierPassed) => { setUnlockedTier(Math.max(unlockedTier, tierPassed + 1)); showToast(`🏆 רמה ${tierPassed + 1} נפתחה בהצלחה!`); addXP(500); }}
            showToast={showToast} resetApp={resetApp}
          />
        </div>
      );
    }
    
    function MainAppTabs({ answers, xp, mastered, workouts, unlockedTier, notifEnabled, onToggleNotif, onToggleAllNotifs, onTestNotif, thisWeekWorkouts, thisWeekMeals, lastReportReset, setLastReportReset, setThisWeekWorkouts, setThisWeekMeals, onMealTrack, lastMealTrack, onWorkoutDone, onToggleSkill, onPassTest, showToast, resetApp, th, isHybrid, caliTiersBase, gymTiersBase }) {
      const [tab, setTab] = useState('home');
      const [dur, setDur] = useState(null);
      const [wType, setWType] = useState('cali');
    
      return (
        <div className="max-w-md mx-auto relative">
          <div className="pb-24 min-h-screen">
            {tab==='home'&&!dur&&<Dashboard answers={answers} xp={xp} workouts={workouts} unlockedTier={unlockedTier} onStart={(d, t)=>{setDur(d); setWType(t);}} resetApp={resetApp} showToast={showToast} thisWeekWorkouts={thisWeekWorkouts} thisWeekMeals={thisWeekMeals} lastReportReset={lastReportReset} setLastReportReset={setLastReportReset} setThisWeekWorkouts={setThisWeekWorkouts} setThisWeekMeals={setThisWeekMeals} th={th} isHybrid={isHybrid}/>}
            {tab==='home'&&dur&&<WorkoutPlayer answers={answers} mastered={mastered} duration={dur} wType={wType} caliTiersBase={caliTiersBase} gymTiersBase={gymTiersBase} unlockedTier={unlockedTier} workoutCount={workouts} onFinish={()=>{onWorkoutDone();setDur(null);}} onExit={()=>setDur(null)} th={th}/>}
            {tab==='skills'&&!dur&&<SkillTree mastered={mastered} unlockedTier={unlockedTier} isHybrid={isHybrid} toggle={onToggleSkill} onPassTest={onPassTest} showToast={showToast} th={th} caliTiersBase={caliTiersBase} gymTiersBase={gymTiersBase} answers={answers} />}
            {tab==='nutrition'&&!dur&&<NutritionView answers={answers} onMealTrack={onMealTrack} lastMealTrack={lastMealTrack} th={th}/>}
            {tab==='notifications'&&!dur&&<NotificationsView answers={answers} notifEnabled={notifEnabled} onToggle={onToggleNotif} onToggleAll={onToggleAllNotifs} onTest={onTestNotif} th={th}/>}
          </div>
          {!dur && (
            <nav className="fixed bottom-0 w-full max-w-md bg-black border-t border-zinc-900 flex justify-around p-3 pb-4 rounded-t-3xl z-40 shadow-2xl">
              {[['home','🏠','בית'],['skills','🌳','טירים'],['nutrition','🥩','תזונה'],['notifications','🔔','התראות']].map(([t,ic,lb])=>(
                <button key={t} onClick={()=>setTab(t)} className={`flex flex-col items-center transition-all duration-300 w-1/4 ${tab===t?`text-white scale-110 -translate-y-1`:'text-zinc-600 hover:text-zinc-400'}`}>
                  <span className="text-2xl mb-1">{ic}</span><span className="text-xs font-bold">{lb}</span>
                </button>
              ))}
            </nav>
          )}
        </div>
      );
    }
    
    function Dashboard({ answers, xp, workouts, unlockedTier, onStart, resetApp, showToast, thisWeekWorkouts, thisWeekMeals, lastReportReset, setLastReportReset, setThisWeekWorkouts, setThisWeekMeals, th, isHybrid }) {
      const today = DAYS_HE[new Date().getDay()];
      const isWorkoutDay = answers.days && answers.days.indexOf(today)>=0;
      const [showModal, setShowModal] = useState(false);
      const [showReport, setShowReport] = useState(false);
      const [pendingType, setPendingType] = useState('cali');
    
      const level = Math.floor(xp/100)+1;
      const xpPct = xp%100;

      const getWeeklyFeedback = () => {
        const targetW = answers.days ? answers.days.length : 3;
        const targetM = 7; 
        let sW = targetW > 0 ? Math.min((thisWeekWorkouts / targetW) * 50, 50) : 50;
        let sM = Math.min((thisWeekMeals / targetM) * 50, 50);
        if (isNaN(sW) || !isFinite(sW)) sW = 0;
        let score = Math.round(sW + sM);
        let text = "";
        if (score >= 90) text = "שבוע מטורף! נתת בראש באימונים ושמרת על התזונה בצורה פסיכית.";

    function WorkoutPlayer({ answers, mastered, duration, wType, caliTiersBase, gymTiersBase, unlockedTier, workoutCount, onFinish, onExit, th }) {
      const [showCamera, setShowCamera] = useState(false);
      
      const [isListening, setIsListening] = useState(false);
      const [coachText, setCoachText] = useState('לחץ על המיקרופון ודבר איתי, אני איתך במנוחה!');
      const [userSpeech, setUserSpeech] = useState('');

      // seed אקראי שנוצר פעם אחת לכל אימון, מבטיח שכל אימון שונה
      const workoutSeed = useRef(Math.floor(Math.random() * 10000));

      const plan = useMemo(() => {
        const seed = workoutSeed.current;
        // פונקציית random דטרמיניסטית המבוססת על seed
        const seededRand = (n, offset = 0) => ((seed * 9301 + 49297 * (n + offset + 1)) % 233280) / 233280;

        const getSkillFromBase = (baseMatrix, targetCols, slotIndex = 0) => {
            if (!baseMatrix || !baseMatrix.length) return { name: 'גיבוי', wFactor: 0, level: 1 }; 
            let actualTierIdx = unlockedTier - 1;
            if (actualTierIdx >= baseMatrix.length) actualTierIdx = baseMatrix.length - 1;
            if (actualTierIdx < 0) actualTierIdx = 0;
            const tier = baseMatrix[actualTierIdx];
            if (tier && tier.skills) {
                // אסוף את כל האפשרויות הלא מושלמות
                const available = targetCols.map(col => tier.skills[col]).filter(sk => sk && !(mastered||[]).includes(sk.id));
                if (available.length > 0) {
                    // בחר אקראית לפי seed + slotIndex כדי שכל תרגיל בסלוט שלו יהיה שונה
                    const idx = Math.floor(seededRand(slotIndex) * available.length);
                    return available[idx];
                }
            }
            const fallbackCol = targetCols[0];
            return baseMatrix[actualTierIdx]?.skills[fallbackCol] || baseMatrix[baseMatrix.length - 1]?.skills[fallbackCol] || { name: 'תרגיל מתקדם', wFactor: 0, level: 1 }; 
        };

        let pPush, pPull, pCore, pLegs;
        if (wType === 'cali') {
            pPush = getSkillFromBase(caliTiersBase, [0, 4], 0); 
            pPull = getSkillFromBase(caliTiersBase, [3, 7], 1); 
            pCore = getSkillFromBase(caliTiersBase, [1, 5, 8], 2); 
            pLegs = getSkillFromBase(caliTiersBase, [2, 6], 3); 
        } else if (wType === 'gym') {
            pPush = getSkillFromBase(gymTiersBase, [0, 4], 0);
            pPull = getSkillFromBase(gymTiersBase, [3, 7], 1);
            pCore = getSkillFromBase(gymTiersBase, [1, 5, 8], 2);
            pLegs = getSkillFromBase(gymTiersBase, [2, 6], 3);
        } else { 
            pPush = getSkillFromBase(caliTiersBase, [0, 4], 0); 
            pPull = getSkillFromBase(caliTiersBase, [3, 7], 1); 
            pLegs = getSkillFromBase(gymTiersBase, [2, 6], 3);  
            pCore = getSkillFromBase(gymTiersBase, [1, 5, 8], 2); 
        }

        let generatedPlan = [
          { target: 'legs', name: pLegs?.name || 'סקוואט', wFactor: pLegs?.wFactor||0, reps: '12' },
          { target: 'push', name: pPush?.name || 'שכיבות סמיכה', wFactor: pPush?.wFactor||0, reps: '10' },
          { target: 'core', name: pCore?.name || 'פלאנק', wFactor: pCore?.wFactor||0, reps: "45 שנ'" },
          { target: 'pull', name: pPull?.name || 'מתח', wFactor: pPull?.wFactor||0, reps: '8' }
        ];

        // ערבוב סדר התרגילים הבסיסיים לפי seed
        for (let i = generatedPlan.length - 1; i > 0; i--) {
          const j = Math.floor(seededRand(i, 100) * (i + 1));
          [generatedPlan[i], generatedPlan[j]] = [generatedPlan[j], generatedPlan[i]];
        }

        let exCount=4, sets=3;
        if (duration===45){exCount=5;sets=3;}
        if (duration===60){exCount=5;sets=4;}
        if (duration===90){exCount=6;sets=4;}
        
        if (exCount > 4) {
            const usedNames = new Set(generatedPlan.map(e => e.name));
            let pLegs2, pPush2;
            if (wType === 'hybrid' || wType === 'cali') {
                pLegs2 = getSkillFromBase(wType==='hybrid'?gymTiersBase:caliTiersBase, [6, 2], 4); 
                pPush2 = getSkillFromBase(caliTiersBase, [4, 0], 5); 
            } else {
                pLegs2 = getSkillFromBase(gymTiersBase, [6, 2], 4);
                pPush2 = getSkillFromBase(gymTiersBase, [4, 0], 5);
            }
            // הוסף רק אם התרגיל לא כפול
            if (pLegs2 && !usedNames.has(pLegs2.name)) {
                generatedPlan.push({ target: 'legs', name: pLegs2.name, wFactor: pLegs2.wFactor||0, reps: '10/רגל' });
            } else {
                generatedPlan.push({ target: 'legs', name: 'מכרעים', wFactor: pLegs2?.wFactor||0, reps: '10/רגל' });
            }
            if (exCount > 5) {
                if (pPush2 && !usedNames.has(pPush2.name)) {
                    generatedPlan.push({ target: 'push', name: pPush2.name, wFactor: pPush2.wFactor||0, reps: '10' });
                } else {
                    generatedPlan.push({ target: 'push', name: 'מקבילים', wFactor: pPush2?.wFactor||0, reps: '10' });
                }
            }
        }
        generatedPlan = generatedPlan.slice(0,exCount);

        let pushMulti = 1.0, pullMulti = 1.0, coreMulti = 1.0, legsMulti = 1.0;
        if(answers.pushups === '30+') pushMulti = 1.8; else if(answers.pushups === '16-30') pushMulti = 1.4; else if(answers.pushups === '0-5') pushMulti = 0.6;
        if(answers.pullups === '10+') pullMulti = 1.8; else if(answers.pullups === '5-10') pullMulti = 1.4; else if(answers.pullups === '0') pullMulti = 0.6;
        const sit = answers.situps || '0-15'; const plnk = answers.plank || 'פחות מדקה';
        if(sit === '50+' || plnk === '3 דקות ומעלה') coreMulti = 1.8; else if(sit === '31-50' || plnk === '2-3 דקות') coreMulti = 1.4; else if(sit === '0-15' && plnk === 'פחות מדקה') coreMulti = 0.6;
        const sq = answers.squats || '0-20';
        if(sq === 'מצליח פיסטול (רגל אחת)' || sq === '51-100') legsMulti = 1.8; else if(sq === '21-50') legsMulti = 1.4; else if(sq === '0-20') legsMulti = 0.6;
        
        const userWeight = parseInt(answers.weight) || 70;

        // ── Progressive Overload ──
        // כל 3 אימונים שהושלמו, הקושי עולה מעט
        const totalWorkouts = parseInt(workoutCount) || 0;
        const progressLevel = Math.floor(totalWorkouts / 3); // עולה כל 3 אימונים
        const repsBonus = Math.min(progressLevel, 8); // עד +8 חזרות בונוס
        const timeBonus = Math.min(progressLevel * 5, 40); // עד +40 שניות בונוס לתרגילי זמן
        const weightBonus = 1 + Math.min(progressLevel * 0.025, 0.25); // עד +25% משקל בונוס

        return generatedPlan.map(e => {
          let multi = 1.0;
          if (e.target === 'push') multi = pushMulti;
          else if (e.target === 'pull') multi = pullMulti;
          else if (e.target === 'core') multi = coreMulti;
          else if (e.target === 'legs') multi = legsMulti;

          let r = e.reps || '10';
          let finalReps = "";
          if(r.includes("שנ'")) finalReps = `${Math.round(parseInt(r) * multi) + timeBonus} שנ'`;
          else if(r.includes("/רגל")) finalReps = `${Math.max(1, Math.round(parseInt(r) * multi) + repsBonus)}/רגל`;
          else finalReps = `${Math.max(1, Math.round(parseInt(r) * multi) + repsBonus)}`;
          
          let wText = "";
          if (e.wFactor) wText = `${Math.round(userWeight * e.wFactor * weightBonus)} ק"ג`;

          return {...e, sets: sets, reps: finalReps, weightText: wText};
        });
      }, [wType, mastered, duration, answers, caliTiersBase, gymTiersBase, unlockedTier, workoutCount, workoutSeed.current]);

      const [exIdx, setExIdx]   = useState(0);
      const [setIdx, setSetIdx] = useState(0);
      
      const [resting, setResting] = useState(false);
      const [timer, setTimer] = useState(0);
      const [done, setDone] = useState(false);

      const ex = plan[exIdx];
      const isTimeBased = ex && ex.reps && ex.reps.includes("שנ'");
      const targetTime = isTimeBased ? parseInt(ex.reps) : 0;
      
      const [exTimerActive, setExTimerActive] = useState(false);
      const [exTimeLeft, setExTimeLeft] = useState(0);

      useEffect(() => {
          if(isTimeBased) setExTimeLeft(targetTime);
          setExTimerActive(false);
      }, [exIdx, setIdx, isTimeBased, targetTime]);

      useEffect(() => {
          if(exTimerActive && exTimeLeft > 0 && !resting) {
              const t = setTimeout(() => setExTimeLeft(l => l - 1), 1000);
              return () => clearTimeout(t);
          }
      }, [exTimerActive, exTimeLeft, resting]);
      
      const restTime = answers.goal && answers.goal.indexOf('ירידה') >= 0 ? 60 : 90;
    
      useEffect(() => {
        if (!resting || timer <= 0) { 
          if (resting && timer === 0) setResting(false); 
          return; 
        }
        const t = setTimeout(() => setTimer(s => s - 1), 1000);
        return () => clearTimeout(t);
      }, [resting, timer]);

      const startSpeechRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("הדפדפן או המכשיר שלך לא תומכים בזיהוי דיבור קולי כרגע.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'he-IL';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => setIsListening(true);
        recognition.onend = () => setIsListening(false);
        recognition.onerror = () => setIsListening(false);
        
        recognition.onresult = async (event) => {
          const speechResult = event.results[0][0].transcript;
          setUserSpeech(speechResult);
          await requestCoachAI(speechResult);
        };
        
        try {
          recognition.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      // הפנייה הישירה ל-Gemini (מתוקן ועובד מהדפדפן)
      const requestCoachAI = async (userText) => {
        if (!GEMINI_API_KEY || GEMINI_API_KEY === "הכנס_את_המפתח_שלך_כאן") {
          setCoachText("שכחת להכניס את ה-API Key שלך בקוד, אחי! תעדכן את השורה למעלה.");
          return;
        }

        setCoachText("שומע אותך, חושב על תגובה...");
        try {
          const systemPrompt = `אתה מאמן כושר אישי מנטור שהוא גם אח גדול, קשוח ומלא אנרגיה. המתאמן כרגע נמצא במנוחה של דקה וחצי בין סטים של התרגיל: ${ex?.name || 'תרגיל כוח'}. זהו סט מספר ${setIdx + 1} מתוך ${ex?.sets || 3}. נשארו לו עוד ${timer} שניות לחזור להתאמן. הוא אמר לך כרגע: "${userText}". תענה לו בצורה קצרה ביותר (עד 2 משפטים קצרים בלבד!), עם המון מוטיבציה וסלנג כושר ישראלי (אחי, יאללה, תן בראש, סט מטורף, להתאבד על המוט, אל תתקרר).`;
          
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
          });
          
          const data = await response.json();
          if (data.error) throw new Error(data.error.message);
          
          const reply = data.candidates[0].content.parts[0].text;
          setCoachText(reply);
          speakResponse(reply);
        } catch (error) {
          setCoachText("קרסה לי הלוגיקה, אחי. תבדוק שהמפתח שלך עובד ושאתה מחובר לאינטרנט.");
        }
      };

      const speakResponse = (text) => {
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'he-IL';
        window.speechSynthesis.speak(utterance);
      };
    
      const finishSet = () => {

    function NutritionView({ answers, onMealTrack, lastMealTrack, th }) {
      const [mood, setMood] = useState('training');
      const [refresh, setRefresh] = useState(0);
      const [expandedRecipe, setExpandedRecipe] = useState(null);
      
      const tdee = useMemo(()=>calcTDEE(answers.weight,answers.height,answers.age,answers.gender,answers.goal),[answers]);
      
      const algSet = new Set((answers.allergies||[]).map(a=>ALLERGY_MAP[a]).filter(Boolean));
      const noAlg = !(answers.allergies||[]).length || (answers.allergies||[]).indexOf('ללא')>=0;
      const dislikesArr = (answers.dislikes || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      
      const getMeal = (t) => {
        let opts = (getDynamicMeals(tdee, mood)[t] || []).filter(m => noAlg || !(m.tags||[]).some(x=>algSet.has(x)));
        if (dislikesArr.length > 0 && opts.length > 0) {
          const tempOpts = opts.filter(m => {
            const ingsStr = typeof m.ings === 'function' ? m.ings(tdee).toLowerCase() : "";
            const nameLower = m.name.toLowerCase();
            return !dislikesArr.some(d => ingsStr.includes(d) || nameLower.includes(d));
          });
          if (tempOpts.length > 0) opts = tempOpts;
        }
        
        if (!opts || opts.length === 0) return {name:'אין ארוחה מתאימה', ings:()=>'נסה לשחרר מגבלות או אלרגיות בשאלון.', multi:0, recipe:''};
        const offset = t === 'morning' ? 0 : t === 'lunch' ? 1 : 2;
        return opts[(refresh + offset) % opts.length] || {name:'אין ארוחה מתאימה', ings:()=>'נסה לשנות את ההגדרות בשאלון.', multi:0, recipe:''};
      };

      const age = answers.age || 25;
      const isUnderage = age < 16;
      const todayStr = new Date().toDateString();
      const alreadyTrackedToday = lastMealTrack === todayStr;

      return (
        <div className="p-6 pt-8 pb-32">
          <div className="flex justify-between items-center mb-6">
            <h1 className="text-4xl font-black text-white">תזונה חכמה</h1>
            <div className="text-left">
              <span className={`block text-xs ${th.textPrimary} font-bold uppercase tracking-widest`}>צריכה יומית</span>
              <span className="text-xl font-black text-white">{tdee} <span className="text-sm font-normal text-zinc-400">קק"ל</span></span>
            </div>
          </div>
          
          <button onClick={onMealTrack} disabled={alreadyTrackedToday} className={`w-full py-4 rounded-2xl font-black text-lg mb-6 shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2 ${alreadyTrackedToday ? 'bg-zinc-800 text-green-400 border border-green-500/30' : `${th.bgPrimary} text-white`}`}>
             {alreadyTrackedToday ? '✓ סומן להיום - יפה מאוד!' : '🍽️ לחץ כאן אם אכלת לפי התפריט היום'}
          </button>
          
          {isUnderage && (
            <div className={`${th.bgPrimary10} border ${th.borderPrimary30} rounded-xl p-4 mb-6`}>
              <div className={`${th.textPrimary} font-bold text-sm mb-1`}>⚠️ שים לב:</div>
              <div className="text-zinc-300 text-xs leading-relaxed">מכיוון שאתה בן {age}, הגוף שלך עדיין בשלבי גדילה. מנוע Fitai חוסם גרעון קלורי קיצוני ומכוון לבנייה.</div>
            </div>
          )}

          <div className="flex gap-3 mb-6 overflow-x-auto pb-1">
            {[['training',`${th.emoji} מתאמן`,`${th.bgPrimary600}`],['rest','🧘 מנוחה','bg-green-700'],['sick','🤒 חולה','bg-zinc-700']].map(([k,lb,cl])=>(
              <button key={k} onClick={()=>setMood(k)} className={`px-5 py-2.5 rounded-full whitespace-nowrap font-bold text-sm transition-all ${mood===k?`${cl} text-white scale-105 shadow-lg`:'bg-zinc-900 text-zinc-400 hover:bg-zinc-800'}`}>{lb}</button>
            ))}
          </div>
          
          <button onClick={()=>setRefresh(r=>r+1)} className={`w-full bg-zinc-900 border border-zinc-700 p-4 rounded-2xl mb-6 font-black ${th.textPrimary} active:scale-95 transition-transform flex justify-center items-center gap-3`}>🔄 ערבב תפריט אישי</button>
          
          {['morning','lunch','evening'].map(t => {
            const meal = getMeal(t);
            const lb = t==='morning' ? 'ארוחת בוקר' : t==='lunch' ? 'ארוחת צהריים' : 'ארוחת ערב';
            const kcal = Math.round(tdee * (meal.multi || 0));
            const ingredientsText = typeof meal.ings === 'function' ? meal.ings(tdee) : meal.ings;
            
            return (
              <div key={t} className="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 mb-5 relative overflow-hidden">
                <div className={`absolute top-0 right-0 w-1.5 h-full ${th.gradientBg}`}/>
                <div className="flex justify-between items-start mb-2">
                   <div className="text-xs font-black text-zinc-500 uppercase tracking-widest">{lb}</div>
                   <div className="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400 font-bold">~{kcal} קק״ל</div>
                </div>
                <h3 className="text-2xl font-black text-white mb-4">{meal.name}</h3>
                
                <div className="bg-black/50 p-4 rounded-xl border border-zinc-800 text-sm text-zinc-300 mb-3">
                  <div className="leading-relaxed">{ingredientsText}</div>
                </div>

                {meal.recipe && (
                  <button onClick={() => setExpandedRecipe(expandedRecipe === meal.name ? null : meal.name)} className={`w-full text-center text-xs font-bold ${th.textPrimary} hover:text-white transition-colors`}>
                    {expandedRecipe === meal.name ? 'הסתר מתכון' : '📖 הצג מתכון מלא'}
                  </button>
                )}

                {expandedRecipe === meal.name && meal.recipe && (
                  <div className="mt-3 p-4 bg-zinc-950 rounded-xl border border-zinc-800 text-xs text-zinc-400 whitespace-pre-wrap text-right leading-relaxed">
                    {meal.recipe}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }
    
    function NotificationsView({ answers, notifEnabled, onToggle, onToggleAll, onTest, th }) {
      const isWorkoutToday = answers.days && answers.days.indexOf(DAYS_HE[new Date().getDay()])>=0;
      const goal = answers.goal && answers.goal.indexOf('ירידה')>=0 ? 'חיטוב' : 'מסה';
      const name = answers.name || 'Lupu';
      const allOn = NOTIF_SLOTS.every(s => notifEnabled[s.id] !== false);
    
      return (
        <div className="p-6 pt-8 pb-32">
          <h1 className="text-4xl font-black text-white mb-1">התראות דחיפה</h1>
          <p className="text-zinc-400 text-sm mb-5">תזכורות נשלחות כהתראות דחיפה לדפדפן גם כשהאפליקציה פתוחה ברקע.</p>
    
          <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mb-5 flex justify-between items-center">
            <button onClick={onToggleAll} className={`w-12 h-6 rounded-full relative transition-all duration-300 ${allOn?th.bgPrimary:'bg-zinc-700'}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all duration-300 ${allOn?'right-0.5':'left-0.5'}`}/>
            </button>
            <div className="text-right">
              <div className="font-black text-white text-sm">הפעל / כבה הכל</div>
              <div className="text-xs text-zinc-500">{NOTIF_SLOTS.filter(s=>notifEnabled[s.id]!==false).length} מתוך {NOTIF_SLOTS.length} פעילות</div>
            </div>
          </div>
    
          <div className="space-y-3">
            {NOTIF_SLOTS.map(slot => {
              const isOn = notifEnabled[slot.id] !== false;
              const body = slot.bodyFn(isWorkoutToday, goal, name);
              return (
                <div key={slot.id} className={`bg-zinc-900 rounded-2xl border transition-all ${isOn?'border-zinc-700':'border-zinc-900'}`}>
                  <div className="flex items-center gap-3 p-4">
                    <div className={`w-11 h-11 rounded-full flex items-center justify-center text-xl flex-shrink-0 transition-all ${isOn?`${th.gradientBg} shadow-lg ${th.shadowPrimary30}`:'bg-zinc-800'}`}>{slot.icon}</div>
                    <div className="flex-1 min-w-0 text-right">
                      <div className="flex justify-between items-center mb-0.5">
                        <span className={`text-xs font-bold tabular-nums ${isOn?th.textPrimary:'text-zinc-600'}`}>{String(slot.hour).padStart(2,'0')}:{String(slot.min).padStart(2,'0')}</span>
                        <span className="font-bold text-white text-sm">{slot.title}</span>
                      </div>
                      <p className="text-xs text-zinc-500 leading-snug truncate">{body}</p>
                    </div>
                    <button onClick={()=>onToggle(slot.id, !isOn)} className={`w-11 h-6 rounded-full relative transition-all duration-300 flex-shrink-0 ${isOn?th.bgPrimary:'bg-zinc-700'}`}>
                      <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all duration-300 ${isOn?'right-0.5':'left-0.5'}`}/>
                    </button>
                  </div>
                  {isOn && (
                    <div className="px-4 pb-3"><button onClick={()=>onTest(slot)} className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold py-2 rounded-xl transition-colors active:scale-95">📬 שלח התראת ניסיון כעת</button></div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
